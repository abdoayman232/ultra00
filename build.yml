name: Build Twilight of Olympus Ultra v10 (Fabric 1.21.11) JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build Mod JAR
        run: gradle build --no-daemon
      - name: Upload Compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: twilight-of-olympus-ultra-v10-1.21.11-jar
          path: build/libs/twilight-of-olympus-ultra-aether-*.jar
